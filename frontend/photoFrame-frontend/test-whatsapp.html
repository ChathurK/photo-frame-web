<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Test</title>
</head>
<body>
    <h1>WhatsApp Test</h1>
    <button onclick="testWhatsApp()">Test WhatsApp Link</button>
    
    <script>
        function testWhatsApp() {
            const message = encodeURIComponent(
                '🖼️ *Test Photo Frame Order #123*\n\n' +
                '📋 *Order Details:*\n' +
                '• Category: Test Category\n' +
                '• Frame Type: Test Frame\n' +
                '• Size: 8x10\n' +
                '• Color: No color selected\n' +
                '• Number of Persons: 2\n\n' +
                '👤 *Customer Information:*\n' +
                '• Name: Test Customer\n' +
                '• WhatsApp: +94771234567\n' +
                '• Address: Test Address\n' +
                '• Delivery: Sri Lanka\n\n' +
                '📝 *Notes:* Test order\n\n' +
                '✅ Order received successfully!'
            );
            
            const whatsappUrl = `https://wa.me/94702923943?text=${message}`;
            console.log('WhatsApp URL:', whatsappUrl);
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
